# 监控运行参数 —— 改这里，不用改代码
#
# 设计原则：**检测放宽保召回，告警收紧保准确，LLM 只用在刀刃上**。
# 三层各管一段，互不干扰：
#   第一层 检测：conf 压很低 + 逐帧过，宁可多报候选（漏在这里就再也救不回来）
#   第二层 规则+时序：连续命中帧数、面积增长、闪烁、静态抑制，把明显不是火的筛掉
#   第三层 LLM：只处理"规则拿不准"的少量目标，且同一区域确认过就不再重复问

cameras:
  # index 是 OpenCV 的设备序号，可以用下面的命令确认哪个是哪个：
  #   python -c "import cv2;[print(i,cv2.VideoCapture(i, cv2.CAP_DSHOW).isOpened()) for i in range(3)]"
  # 本机：0 = Rapoo 外接，1 = Integrated 内置
  - id: cam_0
    name: 外接
    index: 0
    width: 640        # 这颗外接只支持 YUY2，720p 只有 10fps，640x480 才 16.7fps
    height: 480
    enabled: true
  - id: cam_1
    name: 内置
    index: 1
    width: 960        # 内置支持压缩格式，能跑 30fps
    height: 540
    enabled: true

# ── 检测 ──────────────────────────────────────────────────
detect:
  imgsz: 640          # 多路时单帧预算要压下来；896 在 2 路下会互相拖慢
  every: 2            # 每 N 帧检一次。烟是慢过程，抽帧几乎不影响效果，吞吐翻倍
  sliced: false       # 切片能救小目标但贵 4 倍，多路场景先关；单路可开
  fast_smoke: false   # 极快模式（烟不等时序直接 notice）会显著增加误报，关掉

# ── 阈值（第二层）─────────────────────────────────────────
# 用户截图里 fire 0.65 的白衣服误报，根子是 fire_conf 只有 0.30。
thresholds:
  # 检测门限：整幅图送进模型的入口门限
  det_conf: 0.20
  # 框级门限：低于这个值直接丢弃，不建轨迹
  # ⚠️ 这只是「告警」阈值，不是「画框」阈值。
  # 画面上的框来自检测层（det_conf 0.20），低于这里的会画成**黄色候选框**，
  # 让人看得见"系统注意到了这块地方"，只是还不足以报警（红色框）。
  # 早期把两者合成一个值，结果调高之后真火根本不再出现框 —— 那是错的。
  fire_conf: 0.45     # 0.30 -> 0.55 -> 0.45：0.65 的误报本来就高于 0.55，提阈值挡不住它，
  #                     真正防误报的是闪烁闸/静态抑制/连续帧/LLM，不是这个数
  smoke_conf: 0.50    # 同理回调，靠 smoke_confirm=3 与时序判别兜误报

  # 高置信线：达到才画红/橙框。介于 alarm 与 hot 之间的画黄框（疑似，等 LLM 复核），
  # 低于 alarm 的画灰框（只表示看到了）。三档是为了让人一眼分出轻重：
  # 人脸被强光照到能拿 fire 0.49，跟真火 0.82 一样红的话，颜色就失去意义了。
  hot_conf: 0.70
  hot_conf_smoke: 0.75

  # 连续命中帧数：确认"稳定存在"，不是闪一下
  fire_confirm: 6     # 5 -> 6
  smoke_confirm: 3    # 2 -> 3

  # 告警去重（同一块地方不重复报，防轨迹断裂后重报）
  cooldown_sec: 60.0  # 30 -> 60
  dedup_iou: 0.10
  dedup_grow: 0.5

  # 静态抑制：长期不动的东西（白墙高光、消防服）判为非火
  fg_gate: 0.08
  fg_gate_min_dur: 12.0

# ── LLM 闸门（第三层，省钱的关键）───────────────────────────
# 思路：不是"有事就问"，而是"规则拿不准而且这地方没问过"才问。
llm:
  # 只在轨迹活够这么久之后才送审：闪一下的目标不值得花钱
  min_duration_s: 6.0
  # 只有检测置信度落在这个区间才需要 LLM —— 太高自己就能定，太低不值得救
  ## 注意：低于 min_conf 的不送审（省钱），高于 sure_conf 的不送审（没必要）
  min_conf: 0.50
  sure_conf: 0.85
  # 同一目标（按区域，不按轨迹 ID）多久内只问一次。
  # 900 秒太长：同一块地方先被灯反光刷了一次 light，之后真火出现在那儿就被静音了。
  dedup_seconds: 300.0
  # 置信度超过这两个值，静音和"LLM 否定"都不再生效（防真火被误伤）
  mute_bypass_conf: 0.80
  override_conf: 0.85
  # 每小时总调用上限：超了自动降级到规则层，不会漏报，只是不再请模型复核
  hourly_limit: 60
  # 被判"非风险"之后又活过这么久，说明可能判错了，叫回来复核（漏报兜底）
  dismiss_recheck_sec: 30.0

# ── 画面 ──────────────────────────────────────────────────
view:
  max_width: 1280
  jpeg_quality: 72
  fps_limit: 30
  max_bytes: 90000

# ── 看板 ──────────────────────────────────────────────────
ui:
  host: 127.0.0.1
  port: 5050
