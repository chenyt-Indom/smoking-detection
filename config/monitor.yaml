# 监控运行参数 —— 改这里，不用改代码
#
# 设计原则：**检测放宽保召回，告警收紧保准确，LLM 只用在刀刃上**。
# 三层各管一段，互不干扰：
#   第一层 检测：conf 压很低 + 逐帧过，宁可多报候选（漏在这里就再也救不回来）
#   第二层 规则+时序：连续命中帧数、面积增长、闪烁、静态抑制，把明显不是火的筛掉
#   第三层 LLM：只处理"规则拿不准"的少量目标，且同一区域确认过就不再重复问

cameras:
  # index 是 OpenCV 的设备序号，可以用下面的命令确认哪个是哪个：
  #   python -c "import cv2;[print(i,cv2.VideoCapture(i, cv2.CAP_DSHOW).isOpened()) for i in range(3)]"
  # 本机：0 = Rapoo 外接，1 = Integrated 内置
  - id: cam_0
    name: 外接
    index: 0
    width: 640        # 这颗外接只支持 YUY2，720p 只有 10fps，640x480 才 16.7fps
    height: 480
    enabled: true
  - id: cam_1
    name: 内置
    index: 1
    width: 960        # 内置支持压缩格式，能跑 30fps
    height: 540
    enabled: true

# ── 检测 ──────────────────────────────────────────────────
detect:
  # 第二个模型：香烟。和火焰/烟雾分开训练、分开推理，结果合并后一起 NMS。
  # 为什么不用一个模型：香烟本体和明火是两套完全不同的训练数据，
  # 特征空间差得远，硬合成一个会互相干扰、两边精度都掉。
  # 选 v30 的依据：models/ 里 16 个香烟版本中，只有它和 damoyolo_cigarette
  # 能用（后者格式过旧读不出来），且它是迭代到最后的版本（mAP50=0.797）。
  # 实测 12 个版本后选定 v28：3 张真实香烟截图下检出 10 个目标、
  # 最高置信 0.869，明显强于 v30（5 个 / 0.476）。
  # 用户的原话是"之前训练过一个能把细长物体全部识别出来的"——就是它。
  # 代价：85M，比 v30 的 22M 大 4 倍，推理慢一些。
  extra_weights: models/smoke_cig_v28.pt
  # 推理分辨率。⚠️ 这个值必须 >= 相机长边，否则等于把画面"缩小"再检测 ——
  # 远处的小火苗会缩成十几像素的色块，YOLO 直接当噪声跳过。
  # 实测：960x540 的相机配 imgsz=640，20x20 的火缩到 13x13，基本必漏。
  # 提到 960 后保持原尺寸，小目标至少还能看出形状。
  imgsz: 800
  # 抽帧补偿：分辨率提了 2.25 倍算力，把检测频率降到 1/3 拉回一部分。
  # 烟和远处的小火都是慢过程，0.1 秒级的检测间隔完全够用。
  every: 3
  # 切片推理：这是小目标漏检的最后一招，必须开。
  # 模式是 auto —— 先全图粗筛，只有检出东西的帧才切片，
  # 空白帧不付 4 倍成本，有目标的帧再切 2x2 放大细看。
  # 远处 20x20 的火苗经过切片会被放大到 40x40，召回能力翻倍。
  sliced: true
  fast_smoke: false   # 极快模式（烟不等时序直接 notice）会显著增加误报，关掉

# ── 阈值（第二层）─────────────────────────────────────────
# 用户截图里 fire 0.65 的白衣服误报，根子是 fire_conf 只有 0.30。
thresholds:
  # 检测门限：整幅图送进模型的入口门限
  # ── 彩色框阈值（只影响画面配色，不影响告警）──────────
  # 用户要求："门限可以压低，但不要一直有彩色框认错"。
  # 所以把两件事拆开：检测门限压到 0.08/0.12 保证不漏，
  # 而彩色框要 0.45/0.55 以上才上色 —— 中间那一段全是灰框（且限量显示）。
  color_conf: 0.35          # 火：达到才画红框
  color_conf_smoke: 0.42    # 烟：达到才画黄框
  color_conf_cig: 0.38      # 香烟：达到才画蓝框

  # 香烟的门限。它比火/烟更难检（目标小、常被手挡住），门限放宽一档补召回，
  # 误报交给后面的 LLM 裁决 —— 流程和火/烟完全一样。
  cigarette_conf: 0.03

  # 检测门限压到 0.15：远处的火单帧置信普遍偏低，0.20 会把它们挡在门外。
  # 误报由后面的告警阈值 + LLM 裁判兜，检测层只管"别漏"。
  det_conf: 0.05
  # 框级门限：低于这个值直接丢弃，不建轨迹
  # ⚠️ 这只是「告警」阈值，不是「画框」阈值。
  # 画面上的框来自检测层（det_conf 0.20），低于这里的会画成**黄色候选框**，
  # 让人看得见"系统注意到了这块地方"，只是还不足以报警（红色框）。
  # 早期把两者合成一个值，结果调高之后真火根本不再出现框 —— 那是错的。
  # 火告警阈值：0.45 -> 0.35。真火在视频里常因距离/遮挡/单帧模糊只拿到
  # 0.3~0.4，卡在 0.45 就掉进灰色候选档，看着像"没发现"。
  # 防误报靠的是闪烁闸/静态抑制/连续帧/LLM 这几层，不用这个数硬扛。
  fire_conf: 0.18
  smoke_conf: 0.300    # 同理回调，靠 smoke_confirm=3 与时序判别兜误报

  # 高置信线：达到才画红/橙框。介于 alarm 与 hot 之间的画黄框（疑似，等 LLM 复核），
  # 低于 alarm 的画灰框（只表示看到了）。三档是为了让人一眼分出轻重：
  # 人脸被强光照到能拿 fire 0.49，跟真火 0.82 一样红的话，颜色就失去意义了。
  hot_conf: 0.70
  hot_conf_smoke: 0.75

  # 连续命中帧数：确认"稳定存在"，不是闪一下
  fire_confirm: 6     # 5 -> 6
  smoke_confirm: 3    # 2 -> 3

  # 告警去重（同一块地方不重复报，防轨迹断裂后重报）
  cooldown_sec: 60.0  # 30 -> 60
  dedup_iou: 0.10
  dedup_grow: 0.5

  # 静态抑制：长期不动的东西（白墙高光、消防服）判为非火
  fg_gate: 0.08
  fg_gate_min_dur: 12.0

# ── LLM 闸门（第三层，省钱的关键）───────────────────────────
# 思路：不是"有事就问"，而是"规则拿不准而且这地方没问过"才问。
llm:
  # 只在轨迹活够这么久之后才送审：闪一下的目标不值得花钱
  min_duration_s: 6.0
  # 只有检测置信度落在这个区间才需要 LLM —— 太高自己就能定，太低不值得救
  ## 注意：低于 min_conf 的不送审（省钱），高于 sure_conf 的不送审（没必要）
  # ⚠️ min_conf 必须**低于**报警阈值（fire_conf/smoke_conf），
  # 否则会有目标"够格报警却不够格送审"，于是规则层绕过裁判直接定性。
  # 实测事故就是 conf 0.47：过了 fire_conf 0.45，却低于原来的 0.50 送审线，
  # 结果一张人脸被推成了「火情」。Pipeline 启动时会校验这个关系。
  min_conf: 0.18      # 必须 >= 最低的画框门槛(fire_conf)，否则灰框会被送审
  # 免裁线：高于此值才允许规则层**不经过 LLM 直接定性**。
  # 从 0.85 提到 0.92 —— 实测 YOLO 给一张人脸 0.85，正好卡在旧阈值上，
  # 于是裁判连看都没看一眼就被推成了「火情」。定性这件事不该由检测器说了算。
  # 0.92 以上基本只有真正的明亮火焰能拿到，偶尔免裁省一点钱，风险可控。
  sure_conf: 0.92
  # 同一目标（按区域，不按轨迹 ID）多久内只问一次。
  # 900 秒太长：同一块地方先被灯反光刷了一次 light，之后真火出现在那儿就被静音了。
  dedup_seconds: 300.0
  # 置信度超过这两个值，静音和"LLM 否定"都不再生效（防真火被误伤）
  mute_bypass_conf: 0.80
  override_conf: 0.85
  # 每小时总调用上限：超了自动降级到规则层，不会漏报，只是不再请模型复核
  hourly_limit: 120
  # 被判"非风险"之后又活过这么久，说明可能判错了，叫回来复核（漏报兜底）
  dismiss_recheck_sec: 30.0

# ── 画面 ──────────────────────────────────────────────────
view:
  max_width: 1280
  jpeg_quality: 72
  fps_limit: 30
  max_bytes: 90000

# ── 看板 ──────────────────────────────────────────────────
ui:
  host: 127.0.0.1
  port: 5050
