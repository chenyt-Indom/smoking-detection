<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火情监控 · 实时告警</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#242c37; --txt:#e6edf3; --dim:#8b949e;
    --alarm:#f85149; --warning:#f0883e; --notice:#d29922; --cleared:#3fb950;
    --ok:#238636;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.92);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
         padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
  .dot.on{background:var(--cleared);box-shadow:0 0 8px var(--cleared)}
  .stat{color:var(--dim);font-size:12px}
  .stat b{color:var(--txt);font-weight:600}
  main{max-width:1080px;margin:0 auto;padding:16px 20px 60px}
  .banner{border-radius:10px;padding:14px 18px;margin-bottom:16px;
          border-left:4px solid var(--line);background:var(--panel);display:none}
  .banner.show{display:block}
  .banner .t{font-size:15px;font-weight:600;margin-bottom:4px}
  .banner .s{color:var(--dim);font-size:12px}
  .card{display:grid;grid-template-columns:180px 1fr;gap:16px;background:var(--panel);
        border:1px solid var(--line);border-left-width:4px;border-radius:10px;
        padding:12px;margin-bottom:12px;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .card.alarm{border-left-color:var(--alarm)}
  .card.warning{border-left-color:var(--warning)}
  .card.notice{border-left-color:var(--notice)}
  .card.cleared{border-left-color:var(--cleared);opacity:.62}
  /* 同一目标先出 notice、后被 LLM 升级成 alarm 时，旧的 notice 淡化成"已升级"，
     避免管理员把它当成两起独立事件 */
  .card.superseded{opacity:.38}
  .card.superseded .head::after{content:"已升级为正式告警";margin-left:8px;font-size:11px;
      color:var(--dim);border:1px solid var(--line);padding:1px 6px;border-radius:99px}
  .thumb{width:180px;height:120px;object-fit:cover;border-radius:6px;
         background:#000;cursor:zoom-in;display:block}
  .noimg{width:180px;height:120px;border-radius:6px;background:#000;
         display:flex;align-items:center;justify-content:center;color:#444;font-size:12px}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .lv{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.5px}
  .lv.alarm{background:rgba(248,81,73,.15);color:var(--alarm);border:1px solid rgba(248,81,73,.4)}
  .lv.warning{background:rgba(240,136,62,.15);color:var(--warning);border:1px solid rgba(240,136,62,.4)}
  .lv.notice{background:rgba(210,153,34,.15);color:var(--notice);border:1px solid rgba(210,153,34,.4)}
  .lv.cleared{background:rgba(63,185,80,.15);color:var(--cleared);border:1px solid rgba(63,185,80,.4)}
  .kind{font-weight:600}
  .meta{color:var(--dim);font-size:12px}
  ul{margin:6px 0 0;padding-left:18px;color:#b8c2cc;font-size:12.5px}
  li{margin:2px 0}
  .llm{color:#79c0ff}
  .empty{color:var(--dim);text-align:center;padding:60px 0}
  #viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;
          align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
  #viewer img{max-width:94vw;max-height:94vh;border-radius:8px}
  .filters{display:flex;gap:6px;margin-left:auto}
  .filters button{background:var(--panel);color:var(--dim);border:1px solid var(--line);
                  border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .filters button.on{color:var(--txt);border-color:#3d4756;background:#1f2630}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>火情监控 · 实时告警</h1>
  <span class="stat">今日 <b id="n-alarm">0</b> 火情 · <b id="n-warning">0</b> 烟情 · <b id="n-notice">0</b> 待确认 · <b id="n-cleared">0</b> 已排除</span>
  <div class="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="alarm">仅火情</button>
    <button data-f="pending">未排除</button>
  </div>
</header>

<main>
  <div class="banner" id="banner">
    <div class="t" id="banner-t"></div>
    <div class="s" id="banner-s"></div>
  </div>
  <div id="list"><div class="empty">等待事件…（YOLO 发现可疑目标后会立即出现在这里）</div></div>
</main>

<div id="viewer"><img id="viewer-img" alt=""></div>

<script>
const LV_NAME = {alarm:'火情告警', warning:'烟情告警', notice:'待人工确认', cleared:'已排除'};
const KIND = {fire:'火焰', smoke:'烟雾'};
const counts = {alarm:0, warning:0, notice:0, cleared:0};
let filter = 'all';
const list = document.getElementById('list');
const seen = new Set();

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function matches(rec){
  if(filter==='all') return true;
  if(filter==='alarm') return rec.level==='alarm';
  if(filter==='pending') return rec.level==='alarm'||rec.level==='warning'||rec.level==='notice';
  return true;
}

function render(rec){
  const id = rec.wall_ms + '_' + rec.track_id + '_' + rec.level;
  if(seen.has(id)) return;
  seen.add(id);

  if(list.querySelector('.empty')) list.innerHTML='';
  counts[rec.level] = (counts[rec.level]||0) + 1;
  for(const k of Object.keys(counts)) {
    const el = document.getElementById('n-'+k);
    if(el) el.textContent = counts[k];
  }

  if(!matches(rec)) return;

  const card = document.createElement('div');
  card.className = 'card ' + rec.level;
  card.dataset.track = rec.track_id;
  // 升级后把同轨迹的旧 notice 淡掉
  if(rec.level==='alarm'||rec.level==='warning'){
    list.querySelectorAll('.card.notice[data-track="'+rec.track_id+'"]')
        .forEach(el=>el.classList.add('superseded'));
  }
  const reasons = (rec.reasons||[]).map(r=>{
    const cls = r.startsWith('LLM') ? ' class="llm"' : '';
    return `<li${cls}>${esc(r)}</li>`;
  }).join('');
  const img = rec.snapshot
    ? `<img class="thumb" src="${esc(rec.snapshot)}" alt="现场图" onclick="zoom(this.src)">`
    : `<div class="noimg">无截图</div>`;
  const llm = rec.llm_label
    ? `<span class="meta">LLM：${esc(rec.llm_label)} / risk=${esc(rec.llm_risk)} / ${esc(rec.llm_latency)}s</span>`
    : '';

  card.innerHTML = `
    ${img}
    <div>
      <div class="head">
        <span class="lv ${rec.level}">${LV_NAME[rec.level]||rec.level}</span>
        <span class="kind">${KIND[rec.kind]||rec.kind}</span>
        <span class="meta">${esc(rec.cam)} · 轨迹#${esc(rec.track_id)}</span>
        <span class="meta">·</span>
        <span class="meta">${esc(rec.wall)}</span>
        <span class="meta">· 发现后 ${esc(rec.latency)}s 报出</span>
        ${llm}
      </div>
      <ul>${reasons}</ul>
    </div>`;
  list.prepend(card);

  if(rec.level==='alarm') showBanner(rec);
  if(rec.level==='alarm'||rec.level==='warning') beep(rec.level);
}

function showBanner(rec){
  const b=document.getElementById('banner');
  b.className='banner show';
  b.style.borderLeftColor='var(--'+rec.level+')';
  document.getElementById('banner-t').textContent =
    `${LV_NAME[rec.level]} · ${KIND[rec.kind]||rec.kind} · ${rec.cam}`;
  document.getElementById('banner-s').textContent =
    (rec.reasons&&rec.reasons[0]) ? rec.reasons[0] : '';
  clearTimeout(showBanner._t);
  showBanner._t=setTimeout(()=>{ b.className='banner'; }, 20000);
}

let ac;
function beep(level){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = level==='alarm'?880:520;
    g.gain.setValueAtTime(.001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.18, ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.45);
    o.start(); o.stop(ac.currentTime+.46);
  }catch(e){}
}

function zoom(src){
  document.getElementById('viewer-img').src=src;
  document.getElementById('viewer').style.display='flex';
}
document.getElementById('viewer').onclick=()=>{
  document.getElementById('viewer').style.display='none';
};

document.querySelectorAll('.filters button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); filter=b.dataset.f; redraw();
  };
});

let cache=[];
function redraw(){
  list.innerHTML='';
  seen.clear();
  if(!cache.length){ list.innerHTML='<div class="empty">等待事件…</div>'; return; }
  cache.forEach(render);
}

// ── SSE：断线自动重连，重连后补发历史，不会漏事件
// ?nosse=1 → 只拉一次历史不保持长连接（截图/调试用，否则无头浏览器永远等不到加载完成）
const NOSSE = new URLSearchParams(location.search).has('nosse');
const dot=document.getElementById('dot');
function connect(){
  if(NOSSE){ dot.classList.add('on'); return; }
  const es=new EventSource('/events');
  es.onopen=()=>dot.classList.add('on');
  es.onerror=()=>{ dot.classList.remove('on'); };
  es.onmessage=(e)=>{
    const rec=JSON.parse(e.data);
    cache.push(rec);
    if(cache.length>300) cache=cache.slice(-300);
    render(rec);
  };
}
fetch('/api/recent').then(r=>r.json()).then(h=>{
  cache=h; redraw(); connect();
}).catch(()=>connect());
</script>
</body>
</html>
